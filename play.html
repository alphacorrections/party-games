<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play — Party Games</title>
<meta name="theme-color" content="#140B1F">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="phone">

<section id="joinscreen" class="joinwrap">
  <h1>Get in</h1>
  <form id="joinform">
    <div class="field">
      <label for="roomcode">Room code</label>
      <input id="roomcode" maxlength="4" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" placeholder="ABCD">
    </div>
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" autocomplete="nickname" placeholder="What they call you">
    </div>
    <button id="join" type="submit" class="pbtn primary">Join</button>
    <p id="joinerr" class="err small" hidden></p>
  </form>
</section>

<div id="playscreen" hidden>
  <header class="pbar">
    <span id="whoami"></span>
    <span class="score" id="myscore">0</span>
  </header>
  <main id="pstage"></main>
</div>

<script type="module" src="src/play.js"></script>
</body>
</html>
