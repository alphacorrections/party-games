<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play — Party Games</title>
<meta name="theme-color" content="#140B1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css?v=3cb61ed2">
</head>
<body class="phone">

<section id="joinscreen" class="joinwrap">
  <h1>Party<br>Games</h1>
  <form id="joinform">
    <div class="field">
      <label for="name">Your name</label>
      <input id="name" maxlength="16" autocomplete="nickname" placeholder="What they call you">
      <div id="namechips" class="namechips" hidden></div>
      <p class="phint small">Same name every time keeps your all-time score adding up.</p>
    </div>
    <div class="field">
      <label for="roomcode">Room code</label>
      <input id="roomcode" maxlength="4" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" placeholder="ABCD">
    </div>
    <button id="join" type="submit" class="pbtn primary">Join a room</button>
    <div class="orline"><span>or</span></div>
    <button id="hostbtn" type="button" class="pbtn ghost">Start a party on this phone</button>
    <p class="phint small center">No TV needed. Your phone runs it, everyone else joins with the code.</p>
    <p id="joinerr" class="err small" hidden></p>
  </form>
</section>

<div id="playscreen" hidden>
  <header class="pbar">
    <span id="whoami"></span>
    <span id="roomtag" class="roomtag"></span>
    <span id="pbar-tools" class="tools"></span>
    <span class="score" id="myscore">0</span>
  </header>
  <main id="pstage"></main>
</div>

<script type="module" src="src/play.js"></script>
</body>
</html>
