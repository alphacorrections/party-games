<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Host — Party Games</title>
<meta name="theme-color" content="#140B1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="host">

<header class="topbar">
  <span class="brand">Party Games</span>
  <span class="codebox"><span class="lbl">Room</span><span id="code">····</span></span>
  <span id="topbar-tools" class="tools"></span>
  <button id="endgame" hidden>End game</button>
  <span id="modebadge" class="badge">…</span>
</header>

<main class="stage">
  <div id="lobby" class="lobby">
    <section class="joinpanel">
      <h2>Join on your phone</h2>
      <div id="qr"></div>
      <p id="joinurl" class="small"></p>
      <p class="muted small">Or go to the site and enter the room code above.</p>
    </section>

    <section>
      <h2>Players (<span id="pcount">0</span>)</h2>
      <div id="plist" class="plist"></div>
      <div class="menuhead">
        <h2>Pick a game</h2>
        <div class="lenpick" id="lenpick"></div>
      </div>
      <div id="menu" class="menu"></div>
      <button id="again" hidden>Play again</button>
    </section>
  </div>

  <div id="stage"></div>
</main>

<script type="module" src="src/host.js"></script>
<script>
  // If the module above never runs (browser too old for ES modules / modern
  // syntax), say so instead of showing a dead page. host.js sets this flag.
  setTimeout(function () {
    if (!window.__pgBooted) {
      document.body.innerHTML =
        '<div class="oldbrowser"><h1>This browser is too old for the game</h1>' +
        '<p>Open the page from a laptop, a phone, a Fire Stick or a TV made after about 2020, ' +
        'or cast a Chrome tab to this screen.</p></div>';
    }
  }, 6000);
</script>
</body>
</html>
